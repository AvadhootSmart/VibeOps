name: Bug report
description: Something broke or behaved wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VibeOps version
      description: Shown at the foot of the sidebar.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS (Apple Silicon), Windows (WSL)]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options: [OpenRouter, Claude Code, Cursor, opencode]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you asked, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Check they contain no secrets before posting.
